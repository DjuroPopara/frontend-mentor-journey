<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Frontend Mentor|Stats preview</title>
  </head>
  <body>
    <article class="card">
      <section class="card-content">
        <h1 class="card-header">
          Get <span class="purple">insights</span> that help your business grow.
        </h1>
        <p class="card-paragraph">
          Discover the benefits of data analytics and make better decisions
          regarding revenue, customer experience, and overall efficiency.
        </p>

        <ul class="parent">
         <li><div class="child1">
            <h2 class="result-numbers">10K+</h2>
            <h5 class="results">COMPANIES</h5></li> 
          </div>
         <li><div class="child2">
            <h2 class="result-numbers">314</h2>
            <h5 class="results">TEMPLATES</h5></li> 
          </div>
         <li><div class="child3">
            <h2 class="result-numbers">12M+</h2>
            <h5 class="results">QUERIES</h5>
          </li> 
          </div>
        </ul>
      </section>
      <div class="card-image">
        <img class="card-picture" src="image-girls.jpg" alt="image of work" />
      </div>
    </article>
  </body>
</html>
