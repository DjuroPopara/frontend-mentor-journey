<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontend Mentor|NFT preview card</title>
    <link rel="stylesheet" href="style.css" />
    "
    <link
      href="https://fonts.googleapis.com/css?family=Outfit"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="card">
      <article class="card-content">
        <img
          class="card-image"
          src="image-equilibrium.jpg"
          alt="Image Equilibrium"
        />
        <h3 class="card-header">Equilibrium #3429</h3>
        <p class="card-paragraph">
          Our Equilibrium collection promotes balance and calm
        </p>

        <section class="value-time">
          <img src="icon-ethereum.svg" alt="image-ethereum" />
          <span class="value"> <p>0.041ETH</p></span>

          <span class="icon-clock"
            ><img src="icon-clock.svg" alt="image-clock"
          /></span>
          <p>3 Days</p>
        </section>
      </article>
      <section class="author">
        <img class="avatar-image" src="image-avatar.png" alt="author-image" />

        <p>Creation of <span class="author-name">Jules Wyvern</span></p>
      </section>
    </main>
  </body>
</html>
